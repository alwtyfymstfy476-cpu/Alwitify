<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mid-Course Exam MCQ</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --glow: #00ffc8;
    --glow2: #00b4ff;
    --glow3: #7b2fff;
    --correct: #00e5a0;
    --wrong: #ff4466;
    --card-bg: rgba(0, 20, 40, 0.75);
    --text: #d0faff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: #000d1a;
    color: var(--text);
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== ANIMATED BACKGROUND ===== */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
  }

  /* Deep ocean gradient layers */
  #ocean-bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    background:
      radial-gradient(ellipse 120% 60% at 50% 110%, #001a3a 0%, transparent 60%),
      radial-gradient(ellipse 80% 40% at 20% 80%, #003060 0%, transparent 50%),
      radial-gradient(ellipse 60% 40% at 80% 60%, #002244 0%, transparent 50%),
      linear-gradient(180deg, #000510 0%, #000d1a 40%, #001225 70%, #000d1a 100%);
  }

  /* Floating particles */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
    animation: floatUp linear infinite;
    opacity: 0;
  }

  @keyframes floatUp {
    0%   { transform: translateY(110vh) translateX(0) scale(0.5); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(-10vh) translateX(var(--drift)) scale(1); opacity: 0; }
  }

  /* Jellyfish */
  .jellyfish {
    position: fixed;
    z-index: -1;
    pointer-events: none;
    animation: jellydrift linear infinite;
    opacity: 0.15;
  }

  .jellyfish svg {
    filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 30px var(--glow2));
    animation: jellypulse 3s ease-in-out infinite;
  }

  @keyframes jellydrift {
    0%   { transform: translate(0, 110vh); }
    100% { transform: translate(var(--jdrift), -20vh); }
  }

  @keyframes jellypulse {
    0%, 100% { transform: scaleY(1) scaleX(1); }
    50%       { transform: scaleY(0.85) scaleX(1.1); }
  }

  /* Bubbles */
  .bubble {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(0, 255, 200, 0.3);
    background: radial-gradient(circle at 30% 30%, rgba(0,255,200,0.15), transparent);
    pointer-events: none;
    z-index: -1;
    animation: riseUp linear infinite;
  }

  @keyframes riseUp {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    5%   { opacity: 0.8; }
    95%  { opacity: 0.3; }
    100% { transform: translateY(-100vh) translateX(var(--sway)); opacity: 0; }
  }

  /* Rays of light from top */
  .light-ray {
    position: fixed;
    top: -200px;
    width: 2px;
    height: 60vh;
    background: linear-gradient(180deg, rgba(0,200,255,0.12) 0%, transparent 100%);
    transform-origin: top center;
    z-index: -1;
    animation: swayRay ease-in-out infinite;
  }

  @keyframes swayRay {
    0%, 100% { transform: rotate(var(--r1)); opacity: 0.4; }
    50%       { transform: rotate(var(--r2)); opacity: 0.9; }
  }

  /* ===== SCORE BAR ===== */
  #score-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0, 10, 30, 0.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0, 255, 200, 0.2);
    box-shadow: 0 0 30px rgba(0, 200, 255, 0.1), inset 0 -1px 0 rgba(0,255,200,0.15);
  }

  .score-label {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 3px;
    color: rgba(0,255,200,0.6);
    text-transform: uppercase;
  }

  .score-value {
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--glow);
    text-shadow: 0 0 20px var(--glow), 0 0 40px var(--glow2);
    letter-spacing: 2px;
  }

  .score-total { color: rgba(0,255,200,0.4); font-size: 1rem; }

  /* Progress bar */
  #progress-wrap {
    position: fixed;
    top: 56px; left: 0; right: 0;
    height: 3px;
    background: rgba(0,255,200,0.1);
    z-index: 999;
  }

  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--glow2), var(--glow));
    box-shadow: 0 0 10px var(--glow);
    transition: width 0.5s ease;
    width: 0%;
  }

  /* ===== HERO HEADER ===== */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    position: relative;
  }

  .hero-eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 6px;
    color: rgba(0,255,200,0.5);
    text-transform: uppercase;
    margin-bottom: 16px;
    animation: fadeSlideIn 1s ease both;
  }

  .hero-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 0%, var(--glow) 50%, var(--glow2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(0,255,200,0.3));
    animation: fadeSlideIn 1s 0.2s ease both;
    margin-bottom: 12px;
  }

  .hero-sub {
    font-size: 1rem;
    color: rgba(0,255,200,0.5);
    letter-spacing: 2px;
    margin-bottom: 48px;
    animation: fadeSlideIn 1s 0.4s ease both;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Scroll indicator */
  .scroll-hint {
    animation: bobbing 2s ease-in-out infinite, fadeSlideIn 1s 0.8s ease both;
    color: rgba(0,255,200,0.6);
    font-size: 0.9rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .scroll-arrow {
    width: 36px; height: 36px;
    border-right: 2px solid var(--glow);
    border-bottom: 2px solid var(--glow);
    transform: rotate(45deg);
    box-shadow: 4px 4px 10px rgba(0,255,200,0.3);
    animation: arrowPulse 1.5s ease-in-out infinite;
  }

  @keyframes bobbing {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(10px); }
  }

  @keyframes arrowPulse {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; box-shadow: 4px 4px 20px var(--glow); }
  }

  /* Orb decoration */
  .hero-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .orb1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,200,255,0.06) 0%, transparent 70%);
    filter: blur(40px);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: orbBreath 6s ease-in-out infinite;
  }

  .orb2 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(123,47,255,0.08) 0%, transparent 70%);
    filter: blur(60px);
    bottom: 10%; right: 10%;
    animation: orbBreath 8s 2s ease-in-out infinite;
  }

  @keyframes orbBreath {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50%       { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
  }

  /* ===== QUIZ SECTION ===== */
  .quiz-wrapper {
    max-width: 820px;
    margin: 0 auto;
    padding: 80px 20px 100px;
  }

  /* Section divider */
  .section-divider {
    text-align: center;
    margin-bottom: 60px;
  }

  .divider-line {
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .divider-line::before,
  .divider-line::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,255,200,0.4), transparent);
    max-width: 200px;
  }

  .divider-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 10px var(--glow), 0 0 20px var(--glow2);
  }

  /* ===== QUESTION CARD ===== */
  .q-card {
    background: var(--card-bg);
    border: 1px solid rgba(0,255,200,0.12);
    border-radius: 24px;
    padding: 32px;
    margin-bottom: 32px;
    position: relative;
    backdrop-filter: blur(16px);
    box-shadow:
      0 0 0 1px rgba(0,255,200,0.05),
      0 20px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    overflow: hidden;
  }

  .q-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--glow), var(--glow2), transparent);
    opacity: 0.5;
  }

  .q-card:hover {
    transform: translateY(-2px);
    box-shadow:
      0 0 0 1px rgba(0,255,200,0.12),
      0 30px 70px rgba(0,0,0,0.6),
      0 0 40px rgba(0,200,255,0.05),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }

  /* Corner accent */
  .q-card::after {
    content: '';
    position: absolute;
    top: 20px; right: 20px;
    width: 40px; height: 40px;
    border-top: 1px solid rgba(0,255,200,0.2);
    border-right: 1px solid rgba(0,255,200,0.2);
    border-radius: 0 8px 0 0;
  }

  /* Question number badge */
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,255,200,0.1);
    border: 1px solid rgba(0,255,200,0.3);
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--glow);
    margin-bottom: 16px;
    box-shadow: 0 0 12px rgba(0,255,200,0.15);
  }

  .q-text {
    font-size: 1.05rem;
    line-height: 1.75;
    font-weight: 400;
    color: #c8eeff;
    margin-bottom: 24px;
  }

  /* ===== OPTIONS ===== */
  .options-grid { display: flex; flex-direction: column; gap: 10px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .opt::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,255,200,0.05), transparent);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .opt:hover::before { opacity: 1; }

  .opt:hover {
    border-color: rgba(0,255,200,0.3);
    background: rgba(0,255,200,0.06);
    transform: translateX(4px);
    box-shadow: -4px 0 20px rgba(0,255,200,0.1);
  }

  .opt-letter {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(0,255,200,0.08);
    border: 1px solid rgba(0,255,200,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: rgba(0,255,200,0.7);
    transition: all 0.25s;
  }

  .opt:hover .opt-letter {
    background: rgba(0,255,200,0.15);
    color: var(--glow);
  }

  .opt-text {
    font-size: 0.95rem;
    line-height: 1.5;
    color: rgba(210,240,255,0.85);
  }

  /* CORRECT */
  .opt.correct {
    border-color: var(--correct) !important;
    background: rgba(0,229,160,0.12) !important;
    transform: none !important;
    box-shadow: 0 0 0 1px var(--correct), 0 0 30px rgba(0,229,160,0.2), inset 0 0 20px rgba(0,229,160,0.05);
  }

  .opt.correct .opt-letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #000;
  }

  .opt.correct .opt-text { color: #fff; font-weight: 600; }

  /* WRONG */
  .opt.wrong {
    border-color: var(--wrong) !important;
    background: rgba(255,68,102,0.12) !important;
    transform: none !important;
    box-shadow: 0 0 0 1px var(--wrong), 0 0 30px rgba(255,68,102,0.15);
  }

  .opt.wrong .opt-letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .opt.wrong .opt-text { color: rgba(255,200,200,0.9); }

  /* Disabled */
  .opt.disabled { cursor: default; pointer-events: none; }
  .opt.disabled:not(.correct):not(.wrong) { opacity: 0.45; }

  /* ===== FEEDBACK EMOJI ===== */
  .emoji-pop {
    display: none;
    font-size: 2.8rem;
    margin-top: 18px;
    text-align: center;
    animation: emojiIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.5) both;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }

  @keyframes emojiIn {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ===== RIPPLE ON CLICK ===== */
  @keyframes ripple {
    0%   { transform: scale(0); opacity: 0.6; }
    100% { transform: scale(4); opacity: 0; }
  }

  .ripple-el {
    position: absolute;
    border-radius: 50%;
    width: 60px; height: 60px;
    background: rgba(0,255,200,0.3);
    pointer-events: none;
    animation: ripple 0.6s ease-out forwards;
    transform-origin: center;
    margin-left: -30px;
    margin-top: -30px;
  }

  /* ===== FINAL SCORE CARD ===== */
  #final-card {
    display: none;
    text-align: center;
    padding: 60px 40px;
    background: var(--card-bg);
    border: 1px solid rgba(0,255,200,0.2);
    border-radius: 28px;
    margin: 40px 0 80px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 80px rgba(0,200,255,0.1);
    animation: fadeSlideIn 0.8s ease both;
  }

  #final-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 2rem;
    color: var(--glow);
    text-shadow: 0 0 30px var(--glow);
    margin-bottom: 12px;
  }

  #final-score-big {
    font-family: 'Cinzel', serif;
    font-size: 5rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--glow), var(--glow2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(0,255,200,0.4));
    line-height: 1;
    margin: 20px 0;
  }

  #final-msg {
    font-size: 1.1rem;
    color: rgba(0,255,200,0.6);
    letter-spacing: 1px;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(0,255,200,0.3); border-radius: 4px; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .q-card { padding: 22px 16px; border-radius: 18px; }
    .q-text { font-size: 0.95rem; }
    .opt { padding: 12px 14px; }
    .hero-title { font-size: 2rem; }
  }
</style>
</head>
<body>

<!-- Ocean background layers -->
<div id="ocean-bg"></div>
<canvas id="bg-canvas"></canvas>

<!-- Score bar -->
<div id="score-bar">
  <div>
    <div class="score-label">Score</div>
    <div class="score-value"><span id="score">0</span><span class="score-total"> / 25</span></div>
  </div>
  <div style="text-align:right">
    <div class="score-label">Progress</div>
    <div class="score-value" style="font-size:1rem"><span id="answered">0</span><span class="score-total"> answered</span></div>
  </div>
</div>
<div id="progress-wrap"><div id="progress-fill"></div></div>

<!-- Hero -->
<div class="hero">
  <div class="hero-orb orb1"></div>
  <div class="hero-orb orb2"></div>
  <div class="hero-eyebrow">by: al_witify</div>
  <h1 class="hero-title">Mid-Course<br>Exam MCQ</h1>
  <div class="hero-sub">abdomin MCQs</div>
  <div class="scroll-hint" onclick="document.querySelector('.quiz-wrapper').scrollIntoView({behavior:'smooth'})">
    <span>Scroll to Begin</span>
    <div class="scroll-arrow"></div>
  </div>
</div>

<!-- Quiz -->
<div class="quiz-wrapper">
  <div class="section-divider">
    <div class="divider-line"><div class="divider-dot"></div></div>
  </div>
  <div id="quiz-content"></div>
  <div id="final-card">
    <h2>🌊 Exam Complete</h2>
    <div id="final-score-big"></div>
    <div id="final-msg"></div>
  </div>
</div>

<!-- Sounds -->
<audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3" preload="auto"></audio>
<audio id="snd-wrong" src="https://www.myinstants.com/media/sounds/wrong-answer-buzzer.mp3" preload="auto"></audio>

<script>
// ===== BACKGROUND =====
(function buildBG() {
  // Bubbles
  for (let i = 0; i < 40; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const sz = Math.random() * 14 + 4;
    b.style.cssText = `
      width:${sz}px;height:${sz}px;
      left:${Math.random()*100}%;
      bottom:${-sz}px;
      --sway:${(Math.random()-0.5)*80}px;
      animation-duration:${Math.random()*15+10}s;
      animation-delay:${Math.random()*15}s;
    `;
    document.body.appendChild(b);
  }

  // Light rays
  for (let i = 0; i < 8; i++) {
    const r = document.createElement('div');
    r.className = 'light-ray';
    const ang = (Math.random()-0.5)*30;
    r.style.cssText = `
      left:${10+i*12}%;
      --r1:${ang-5}deg;
      --r2:${ang+5}deg;
      animation-duration:${Math.random()*6+6}s;
      animation-delay:${Math.random()*5}s;
      opacity:${Math.random()*0.4+0.1};
    `;
    document.body.appendChild(r);
  }

  // Jellyfish SVG
  const jellySVG = `<svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="40" cy="35" rx="32" ry="28" fill="rgba(0,200,255,0.08)" stroke="rgba(0,255,200,0.3)" stroke-width="1"/>
    <ellipse cx="40" cy="35" rx="20" ry="16" fill="rgba(0,200,255,0.05)"/>
    <line x1="28" y1="62" x2="22" y2="100" stroke="rgba(0,255,200,0.2)" stroke-width="1"/>
    <line x1="34" y1="63" x2="30" y2="105" stroke="rgba(0,255,200,0.15)" stroke-width="1"/>
    <line x1="40" y1="63" x2="40" y2="108" stroke="rgba(0,200,255,0.2)" stroke-width="1"/>
    <line x1="46" y1="63" x2="50" y2="105" stroke="rgba(0,255,200,0.15)" stroke-width="1"/>
    <line x1="52" y1="62" x2="58" y2="100" stroke="rgba(0,255,200,0.2)" stroke-width="1"/>
  </svg>`;

  for (let i = 0; i < 3; i++) {
    const j = document.createElement('div');
    j.className = 'jellyfish';
    const sz = Math.random() * 80 + 60;
    j.style.cssText = `
      width:${sz}px;height:${sz*1.3}px;
      left:${10+i*35}%;
      --jdrift:${(Math.random()-0.5)*200}px;
      animation-duration:${Math.random()*30+40}s;
      animation-delay:${Math.random()*20}s;
      opacity:${Math.random()*0.1+0.05};
    `;
    j.innerHTML = jellySVG;
    document.body.appendChild(j);
  }

  // Canvas particles (bioluminescent orbs)
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, orbs = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 60; i++) {
    orbs.push({
      x: Math.random() * 2000 - 500,
      y: Math.random() * 1000,
      r: Math.random() * 3 + 0.5,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -(Math.random() * 0.4 + 0.1),
      alpha: Math.random(),
      dAlpha: (Math.random() - 0.5) * 0.01,
      color: Math.random() > 0.5 ? '0,255,200' : '0,180,255'
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    orbs.forEach(o => {
      o.x += o.vx; o.y += o.vy;
      o.alpha += o.dAlpha;
      if (o.alpha <= 0 || o.alpha >= 1) o.dAlpha *= -1;
      if (o.y < -10) { o.y = H + 10; o.x = Math.random() * W; }

      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 8);
      g.addColorStop(0, `rgba(${o.color},${o.alpha * 0.8})`);
      g.addColorStop(1, `rgba(${o.color},0)`);
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * 8, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

  { q: "A patient with pancreatitis develops an abscess localized in the lesser sac. Which of the following structures forms the anterior wall of the lesser sac?", options: ["Transverse mesocolon", "Greater omentum", "Posterior wall of the stomach", "Pancreas", "Left kidney"], a: 2 },

const emojisCorrect = ["🪿","❤️","🔥","❤️‍🔥","🫶","💯","💪","😍"];
const emojisWrong   = ["😑","🤦","💤","❌","💔","🦖","😂"];

let score = 0;
let answeredCount = 0;
const TOTAL = quizData.length;

const quizBox = document.getElementById('quiz-content');

quizData.forEach((data, idx) => {
  const card = document.createElement('div');
  card.className = 'q-card';

  const numBadge = document.createElement('div');
  numBadge.className = 'q-num';
  numBadge.textContent = idx + 1;

  const qText = document.createElement('div');
  qText.className = 'q-text';
  qText.textContent = data.q;

  const optsGrid = document.createElement('div');
  optsGrid.className = 'options-grid';

  const emoji = document.createElement('div');
  emoji.className = 'emoji-pop';

  let answered = false;
  const letters = ['A','B','C','D','E'];

  data.options.forEach((txt, i) => {
    const opt = document.createElement('div');
    opt.className = 'opt';

    const letter = document.createElement('div');
    letter.className = 'opt-letter';
    letter.textContent = letters[i];

    const label = document.createElement('div');
    label.className = 'opt-text';
    label.textContent = txt;

    opt.appendChild(letter);
    opt.appendChild(label);

    opt.onclick = (e) => {
      if (answered) return;
      answered = true;

      // Ripple effect
      const rip = document.createElement('div');
      rip.className = 'ripple-el';
      const rect = opt.getBoundingClientRect();
      rip.style.left = (e.clientX - rect.left) + 'px';
      rip.style.top  = (e.clientY - rect.top)  + 'px';
      rip.style.background = i === data.a
        ? 'rgba(0,229,160,0.4)' : 'rgba(255,68,102,0.4)';
      opt.appendChild(rip);
      setTimeout(() => rip.remove(), 700);

      // Disable all
      optsGrid.querySelectorAll('.opt').forEach(o => o.classList.add('disabled'));

      const isCorrect = (i === data.a);
      if (isCorrect) {
        opt.classList.add('correct');
        score++;
        document.getElementById('score').textContent = score;
        emoji.textContent = emojisCorrect[Math.floor(Math.random() * emojisCorrect.length)];
        tryPlay('snd-correct');
      } else {
        opt.classList.add('wrong');
        optsGrid.children[data.a].classList.add('correct');
        emoji.textContent = emojisWrong[Math.floor(Math.random() * emojisWrong.length)];
        tryPlay('snd-wrong');
      }

      emoji.style.display = 'block';
      emoji.style.animation = 'none';
      void emoji.offsetWidth;
      emoji.style.animation = '';

      // Update progress
      answeredCount++;
      document.getElementById('answered').textContent = answeredCount;
      document.getElementById('progress-fill').style.width = (answeredCount / TOTAL * 100) + '%';

      if (answeredCount === TOTAL) {
        setTimeout(showFinalScore, 800);
      }
    };

    optsGrid.appendChild(opt);
  });

  card.appendChild(numBadge);
  card.appendChild(qText);
  card.appendChild(optsGrid);
  card.appendChild(emoji);
  quizBox.appendChild(card);
});

function tryPlay(id) {
  try {
    const el = document.getElementById(id);
    el.currentTime = 0;
    el.play().catch(() => {});
  } catch(e) {}
}

function showFinalScore() {
  const fc = document.getElementById('final-card');
  fc.style.display = 'block';
  document.getElementById('final-score-big').textContent = score + ' / ' + TOTAL;
  const pct = Math.round(score / TOTAL * 100);
  let msg;
  if (pct >= 90) msg = '🌊 Exceptional! You mastered this exam.';
  else if (pct >= 75) msg = '💎 Great work! A strong performance.';
  else if (pct >= 60) msg = '🔬 Good effort — review the misses.';
  else msg = '📖 Keep studying — you\'ve got this!';
  document.getElementById('final-msg').textContent = msg;
  fc.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>
